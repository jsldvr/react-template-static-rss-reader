<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/news.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A customizable RSS aggregator template built with React, Vite, and Tailwind CSS." />
    <title>React RSS</title>
    <!-- Preload critical fonts to prevent layout shift -->
    <link rel="preload" href="/fonts/newsreader-400.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/newsreader-medium.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/newsreader-bold.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <!-- Inline critical font CSS to prevent FOUT -->
    <style>
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/newsreader-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/newsreader-medium.woff2") format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/newsreader-bold.woff2") format("woff2");
      }
      html, body {
        font-family: "Newsreader", system-ui, -apple-system, sans-serif;
        background-color: rgb(249 250 251);
      }
      /* Ensure initial paint respects theme class on <html> */
      html.dark,
      html.dark body {
        background-color: rgb(17 24 39);
      }
      /* Improve UA components (e.g., scrollbars) to match theme */
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
